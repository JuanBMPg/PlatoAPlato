plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace = 'com.platoaplato.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.platoaplato.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 3
        versionName = '1.2'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Firma la release con la clave de depuración para poder instalarla directamente.
            // Antes de subirla a Google Play hay que crear una clave propia (Fase 5).
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.19.1'

    // Firebase: Gemini sin clave (AI Logic), protección contra abusos (App Check) y errores (Crashlytics)
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-crashlytics'
    // Solo en la versión de pruebas: token de depuración de App Check (ver src/debug)
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'

    // Escáner de códigos de barras de Google Play services (sin permiso de cámara: la interfaz la pone Google)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // Necesario para usar el SDK de Firebase AI desde Java (ListenableFuture)
    implementation 'com.google.guava:guava:33.8.0-android'
    implementation 'org.reactivestreams:reactive-streams:1.0.4'
}
